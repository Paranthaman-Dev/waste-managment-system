services:
  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: waste-backend
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/waste.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      UPLOAD_DIR: /app/uploads
      PYTHONPATH: /app
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
      - sqlite_data:/app/data
    ports:
      - "8000:8000"
    expose:
      - "8000"
    command: >
      sh -c "mkdir -p /app/data && python -m alembic -c alembic.ini upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  caddy:
    image: docker.io/library/caddy:2-alpine
    container_name: waste-caddy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

volumes:
  sqlite_data:
  upload_data:
