version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: waste-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waste_management}
      POSTGRES_USER: ${POSTGRES_USER:-waste_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waste_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waste_user} -d ${POSTGRES_DB:-waste_management}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: waste-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-waste_user}:${POSTGRES_PASSWORD:-waste_pass}@postgres:5432/${POSTGRES_DB:-waste_management}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      UPLOAD_DIR: /app/uploads
      PYTHONPATH: /app
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    container_name: waste-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
  upload_data: